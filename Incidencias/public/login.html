<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Sistema de Incidencias</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- header ===== -->
  <header class="navbar">
    <span class="marca">Incidencias FES Aragón</span>
  </header>

  <!-- contenido -->
  <main class="centrado">
    <section class="tarjeta angosta">
      <h1>Iniciar sesión</h1>

      <!-- Alerta de error -->
      <div id="error-alert" class="alerta error d-none" role="alert">
        Correo o contraseña incorrectos.
      </div>

      <!-- Formulario -->
      <form action="/api/login" method="POST">
        <div class="campo">
          <label for="correo">Correo Institucional</label>
          <input type="email" id="correo" name="correo" placeholder="usuario@unam.mx" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>
        </div>
        <button type="submit" class="boton">Ingresar</button>
        <a href="registro.html" class="boton-secundario">Crear cuenta</a>
      </form>
    </section>
  </main>

  <!--footer ===== -->
  <footer>
    Sistema de reporte de incidencias · FES Aragón · Ingeniería en Computación
  </footer>

  <script>
    // Muestra alerta si la URL contiene ?error=true
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'true') {
      document.getElementById('error-alert').classList.remove('d-none');
    }
  </script>
</body>
</html>
