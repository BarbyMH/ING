<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Incidencias</title>
    <!-- Enlace de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 text-primary">Sistema de Incidencias</h3>
                        
                        <!-- Alerta de error -->
                        <div id="error-alert" class="alert alert-danger d-none" role="alert">
                            Correo o contraseña incorrectos.
                        </div>

                        <!-- Formulario -->
                        <form action="/api/login" method="POST">
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Institucional</label>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@unam.mx" required>
                            </div>
                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- FIN DEL CONTENEDOR PRINCIPAL -->

    <script>
        // Muestra alerta si la URL contiene ?error=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'true') {
            document.getElementById('error-alert').classList.remove('d-none');
        }
    </script>
</body>
</html>
