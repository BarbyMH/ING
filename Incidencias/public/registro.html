<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Sistema de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 text-primary">Registrar Nuevo Usuario</h3>
                        
                        <form action="/api/registro" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Institucional</label>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@unam.mx" required>
                            </div>
                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Rol en el Sistema</label>
                                <select class="form-select" id="rol" name="rol" required>
                                    <option value="ALUMNO">Alumno</option>
                                    <option value="PROFESOR">Profesor</option>
                                    <option value="ADMINISTRADOR">Administrador</option>
                                    <option value="MANTENIMIENTO">Mantenimiento</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3">Registrarse</button>
                            <a href="login.html" class="btn btn-outline-secondary w-100">Volver al Login</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
