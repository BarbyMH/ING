<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario - Sistema de Incidencias</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- header -->
  <header class="navbar">
    <span class="marca">Incidencias FES Aragón</span>
  </header>

  <!-- contenido -->
  <main class="centrado">
    <section class="tarjeta angosta">
      <h1>Registrar nuevo usuario</h1>

      <form action="/api/registro" method="POST">
        <div class="campo">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="campo">
          <label for="correo">Correo Institucional</label>
          <input type="email" id="correo" name="correo" placeholder="usuario@unam.mx" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>
        </div>
        <div class="campo">
          <label for="rol">Rol en el Sistema</label>
          <select id="rol" name="rol" required>
            <option value="ALUMNO">Alumno</option>
            <option value="PROFESOR">Profesor</option>
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="MANTENIMIENTO">Mantenimiento</option>
          </select>
        </div>
        <button type="submit" class="boton">Registrarse</button>
        <a href="login.html" class="boton-secundario">Volver al Login</a>
      </form>
    </section>
  </main>

  <!-- footer -->
  <footer>
    Sistema de reporte de incidencias · FES Aragón · Ingeniería en Computación
  </footer>

</body>
</html>
