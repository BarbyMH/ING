<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis incidencias · FES Aragón</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- header -->
  <header class="navbar">
    <span class="marca">Incidencias FES Aragón</span>
    <nav>
      <a href="formulario-incidencia.html">Registrar incidencia</a>
      <a href="mis-incidencias.html">Mis incidencias</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <!--contenido -->
  <main>
    <h1 class="titulo-pagina">Mis incidencias</h1>

    <!-- Tabla -->
    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Descripción</th>
            <th>Ubicación</th>
            <th>Fecha</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <!-- Ejemplo de la estructura de una fila (el estado usa: pendiente, asignada, proceso o resuelta):
          <tr>
            <td><strong>#INC-0000</strong></td>
            <td>Descripción de la incidencia</td>
            <td>Edificio, salón</td>
            <td>dd/mm/aaaa</td>
            <td><span class="estado pendiente">Pendiente</span></td>
          </tr>
          -->
        </tbody>
      </table>
    </div>

    <!-- Mensaje cuando el alumno todavía no tiene incidencias (ocultar o quitar cuando haya filas) -->
    <p class="vacio">Todavía no has registrado ninguna incidencia.</p>
  </main>

  <!--footer -->
  <footer>
    Sistema de reporte de incidencias · FES Aragón · Ingeniería en Computación
  </footer>

</body>
</html>
